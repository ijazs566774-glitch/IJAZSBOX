<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Box</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #222;
        }

        .search-form {
            display: flex;
            background: white;
            padding: 8px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 50px;
        }

        .search-button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 0 25px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
        }

        .search-button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Search</h1>

        <!-- Formspree -->
        <form
            class="search-form"
            action="https://formspree.io/f/mjybwnrg"
            method="POST"
        >

            <input
                class="search-input"
                type="text"
                name="search_query"
                placeholder="What are you looking for?"
                required
            >

            <button class="search-button" type="submit">
                Search
            </button>

        </form>

    </div>

</body>
</html>
