<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 20px;
      text-align: center;
    }

    .logo {
      font-size: 72px;
      font-weight: bold;
      margin-bottom: 30px;
      letter-spacing: -5px;
    }

    .logo span:nth-child(1) { color: #4285F4; }
    .logo span:nth-child(2) { color: #EA4335; }
    .logo span:nth-child(3) { color: #FBBC05; }
    .logo span:nth-child(4) { color: #4285F4; }
    .logo span:nth-child(5) { color: #34A853; }
    .logo span:nth-child(6) { color: #EA4335; }

    form {
      width: 100%;
    }

    .search-box {
      width: 100%;
      height: 52px;
      border: 1px solid #dfe1e5;
      border-radius: 26px;
      padding: 0 22px;
      font-size: 17px;
      outline: none;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
      transition: box-shadow 0.2s;
    }

    .search-box:hover,
    .search-box:focus {
      box-shadow: 0 1px 8px rgba(32, 33, 36, 0.25);
    }

    .buttons {
      margin-top: 28px;
    }

    button {
      border: 1px solid #f8f9fa;
      background: #f8f9fa;
      padding: 11px 20px;
      margin: 0 5px;
      border-radius: 4px;
      font-size: 14px;
      color: #202124;
      cursor: pointer;
    }

    button:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    }

    .message {
      margin-top: 25px;
      color: #188038;
      display: none;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 55px;
      }

      .search-box {
        height: 48px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span>
    </div>

    <form
      action="https://formspree.io/f/mjybwnrg"
      method="POST"
    >

      <input
        type="text"
        name="search_query"
        class="search-box"
        placeholder="Search..."
        autocomplete="off"
        required
      >

      <div class="buttons">
        <button type="submit">Search</button>
        <button type="reset">Clear</button>
      </div>

    </form>

  </div>

</body>
</html>
