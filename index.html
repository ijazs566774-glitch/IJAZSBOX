<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Box</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .search-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input {
            width: 300px;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="search-container">
        <h2>Search</h2>

        <form
            action="https://formsubmit.co/ijazs566774@gmail.com"
            method="POST"
        >

            <div class="search-box">
                <input
                    type="text"
                    name="search_query"
                    placeholder="Enter your search..."
                    required
                >

                <button type="submit">Search</button>
            </div>

            <!-- FormSubmit settings -->
            <input type="hidden" name="_subject" value="New Search Box Submission">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

        </form>
    </div>

</body>
</html>
