<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 25px;
            gap: 20px;
            font-size: 14px;
        }

        .top-bar a {
            text-decoration: none;
            color: #202124;
        }

        .top-bar a:hover {
            text-decoration: underline;
        }

        /* Main Search Area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 150px;
        }

        /* Logo */
        .logo {
            font-size: 72px;
            font-weight: 500;
            letter-spacing: -5px;
            margin-bottom: 35px;
        }

        .logo span:nth-child(1) {
            color: #4285F4;
        }

        .logo span:nth-child(2) {
            color: #EA4335;
        }

        .logo span:nth-child(3) {
            color: #FBBC05;
        }

        .logo span:nth-child(4) {
            color: #4285F4;
        }

        .logo span:nth-child(5) {
            color: #34A853;
        }

        .logo span:nth-child(6) {
            color: #EA4335;
        }

        .search-form {

            max-width: 584px;
        }

            width: 100%;

        }

        .search-box:focus-within {
            box-shadow:
                0 1px 6px rgba(32, 33, 36, 0.28);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            opacity: 0.6;
        }

        .search-input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;

        .search-input::placeholder {
            color: #70757a;

        /* Search Buttons */
        .buttons {
            display: flex;

            gap: 12px;

        }

        .search-button {
            border: 1px solid #f8f9fa;
            background: #f8f9fa;

            border-radius: 4px;

            border: 1px solid #dadce0;

        /* Message */

        footer {
            background: #f2f2f2;

        }

        /* Mobile */
        @media (max-width: 600px) {

            .main {
                padding-top: 100px;

            .logo {
                font-size: 55px;
            }

    </style>
</head>

<body>

    <!-- Top Navigation -->
    <div class="top-bar">
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <!-- Main Content -->
    <main class="main">

        <!-- Logo -->
        <div class="logo">
            <span>S</span>
            <span>e</span>
            <span>a</span>
            <span>r</span>
            <span>c</span>
            <span>h</span>
        </div>

        <!-- Formspree Search Form -->
        <form
            id="searchForm"
            class="search-form"
            action="https://formspree.io/f/mjybwnrg"
            method="POST"
        >

            <div class="search-box">

                <!-- Search Icon -->
                <svg
                    class="search-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                >
                    <path
                        d="M9.5 3a6.5 6.5 0 1 0 4.08 11.56l5.43 5.43
                        1.41-1.41-5.43-5.43A6.5 6.5 0 0 0 9.5 3zm0
                        2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"
                    />
                </svg>

                <!-- User Search Text -->
                <input
                    type="text"
                    name="search_query"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search anything..."
                    autocomplete="off"
                    required
                >

            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button
                    type="submit"
                    class="search-button"
                >
                    Search
                </button>

                <button
                    type="button"
                    class="search-button"
                    id="luckyButton"
                >
                    I'm Feeling Lucky
                </button>

            </div>

            <!-- Status Message -->
            <div
                id="successMessage"
                class="message success"
            >
                Search received successfully!
            </div>

            <div
                id="errorMessage"
                class="message error"
            >
                Something went wrong. Please try again.
            </div>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        Your Search Platform
    </footer>


    <script>

        const form = document.getElementById("searchForm");
        const input = document.getElementById("searchInput");
        const successMessage = document.getElementById("successMessage");
        const errorMessage = document.getElementById("errorMessage");
        const luckyButton = document.getElementById("luckyButton");


        /* Submit Search to Formspree */
        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const searchText = input.value.trim();

            if (searchText === "") {
                return;
            }

            successMessage.style.display = "none";
            errorMessage.style.display = "none";

            try {

                const response = await fetch(
                    "https://formspree.io/f/xyegwryb",
                    {
                        method: "POST",

                        headers: {
                            "Accept": "application/json",
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            search_query: searchText
                        })
                    }
                );


                if (response.ok) {

                    successMessage.textContent =
                        "Search received successfully!";

                    successMessage.style.display = "block";

                    console.log(
                        "User searched:",
                        searchText
                    );

                    /*
                     * Optional:
                     * Clear the search box after submission.
                     */
                    input.value = "";

                } else {

                    errorMessage.textContent =
                        "Unable to submit the search.";

                    errorMessage.style.display = "block";
                }

            } catch (error) {

                console.error(error);

                errorMessage.textContent =
                    "Network error. Please try again.";

                errorMessage.style.display = "block";
            }

        });


        /* I'm Feeling Lucky Button */
        luckyButton.addEventListener("click", function() {

            const searchText = input.value.trim();

            if (searchText === "") {

                input.focus();

                return;
            }

            form.dispatchEvent(
                new Event("submit", {
                    bubbles: true,
                    cancelable: true
                })
            );

        });


        /* Focus Search Box When Page Loads */
        window.addEventListener("load", function() {
            input.focus();
        });

    </script>

</body>
</html>
