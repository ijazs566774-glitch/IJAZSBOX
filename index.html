<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Box</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .search-container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        form {
            display: flex;
            background: white;
            padding: 8px;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 50px;
        }

        button {
            border: none;
            background: #007bff;
            color: white;
            padding: 0 25px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="search-container">

    <h1>Search</h1>

    <form action="https://formspree.io/f/mjybwnrg" method="POST">

        <!-- Whatever the user types is sent to Formspree -->
        <input
            type="text"
            name="search_query"
            placeholder="Enter your search..."
            required
        >

        <button type="submit">Search</button>

    </form>

</div>

</body>
</html>
